[build]
entrypoints = ["src/index.js"]
outdir = "public"
target = "browser"
format = "esm"
splitting = false
minify = false
sourcemap = "external"

[build.define]
"process.env" = "{}"
"process.env.NODE_ENV" = "\"production\""

# Path aliases matching jsconfig.json
[resolve]
alias = { "~" = "src", "chess/es" = "packages/chess/src", "ui/es" = "packages/ui/src" }
